name: Publicar frontend no S3

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publicar-frontend
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o Vite
        run: npm run build

      - name: Obter credenciais temporárias da AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: orbita-frontend-${{ github.run_id }}
          aws-region: us-east-2

      - name: Enviar arquivos compilados ao S3
        run: aws s3 sync dist/ s3://tcc-edn-grupo2-orbita/

      - name: Atualizar o cache do CloudFront
        run: aws cloudfront create-invalidation --distribution-id EQPKWTHMXCJVM --paths '/*'
