<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="930" viewBox="0 0 3400 930" role="img" aria-labelledby="title description">
<title id="title">Fluxograma da arquitetura Órbita na AWS</title>
<desc id="description">Fluxo horizontal do navegador ou terminal pelo WAF e CloudFront, com origens S3 e API Gateway. O API Gateway invoca a Lambda, que valida um cabeçalho antes de gravar no DynamoDB. O WAF e a Lambda enviam logs para grupos do CloudWatch em regiões diferentes. O diagrama também mostra a tentativa de fetch cross-origin sujeita a CORS e a chamada direta do terminal que ignora CORS.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#aab6bf"/></marker>
<marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#659fc9"/></marker>
<marker id="arrow-bypass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#ec9a83"/></marker>
<style>
.node-title { fill:#b8ddff; font:700 29px Arial,sans-serif; }
.node-line { fill:#add0ec; font:22px Arial,sans-serif; }
.box { fill:#00335d; stroke:#27618a; stroke-width:2; }
.outline { fill:#071b29; stroke:#27618a; stroke-width:2; }
.decision { fill:#001b2e; stroke:#2371a4; stroke-width:2; stroke-dasharray:6 5; }
.blocked { fill:#10283d; stroke:#235c83; stroke-width:2; }
.log-box { fill:#0c3456; stroke:#4086ae; stroke-width:2; }
.pill { fill:#001c2e; stroke:#236c9e; stroke-width:2; }
.warning-pill { fill:#2e1e1b; stroke:#b66e5c; stroke-width:2; }
.pill-text { fill:#abd8fc; font:700 21px Arial,sans-serif; }
.flow { fill:none; stroke:#aab6bf; stroke-width:3; marker-end:url(#arrow); }
.alternate { fill:none; stroke:#659fc9; stroke-width:3; marker-end:url(#arrow-alt); }
.bypass { fill:none; stroke:#ec9a83; stroke-width:3; stroke-dasharray:14 9; marker-end:url(#arrow-bypass); }
.log-flow { fill:none; stroke:#82acb9; stroke-width:3; stroke-dasharray:8 6; marker-end:url(#arrow); }
.note { fill:#b9dff7; font:700 21px Arial,sans-serif; }
.minor { fill:#9bbacc; font:20px Arial,sans-serif; }
</style>
</defs>
<rect width="3400" height="930" fill="#181818"/>
<text x="45" y="48" fill="#e8f3ff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Órbita · arquitetura e caminhos de acesso</text>
<text x="45" y="77" fill="#a6bfd1" font-family="Arial,sans-serif" font-size="20">Diagrama lógico da implantação feita pelo Console AWS</text>
<path class="flow" d="M330 388 H800"/>
<path class="alternate" d="M330 340 H370 V138 H430"/>
<path class="alternate" d="M760 138 H830"/>
<path class="alternate" d="M1180 123 H1260"/>
<path class="alternate" d="M1005 193 V218 H1670 V532 H1740"/>
<path class="flow" d="M1100 388 H1180"/>
<path class="flow" d="M1490 370 H1610 V287 H1740"/>
<path class="flow" d="M1490 410 H1600 V532 H1740"/>
<path class="flow" d="M2060 532 H2230"/>
<path class="flow" d="M2550 532 H2670"/>
<path class="flow" d="M2970 507 H3010 V420 H3060"/>
<path class="flow" d="M2970 557 H3010 V668 H3060"/>
<path class="log-flow" d="M950 455 V670"/>
<path class="log-flow" d="M2380 595 V698"/>
<path class="alternate" d="M330 690 H700 V410 H800"/>
<path class="bypass" d="M330 750 V842 H1670 V558 H1740"/>
<g><rect class="pill" x="393" y="307" width="352" height="78" rx="24"/><text class="pill-text" x="569" y="338" text-anchor="middle">GET / ou POST /api/visits</text><text class="pill-text" x="569" y="365" text-anchor="middle">mesmo domínio CloudFront</text></g>
<g><rect class="pill" x="1495" y="425" width="240" height="78" rx="24"/><text class="pill-text" x="1615" y="456" text-anchor="middle">behavior /api/*</text><text class="pill-text" x="1615" y="483" text-anchor="middle">POST + header</text></g>
<g><rect class="pill" x="1280" y="184" width="310" height="78" rx="24"/><text class="pill-text" x="1435" y="215" text-anchor="middle">se CORS permitir,</text><text class="pill-text" x="1435" y="242" text-anchor="middle">POST sem header</text></g>
<g><rect class="pill" x="425" y="610" width="258" height="52" rx="24"/><text class="pill-text" x="554" y="643" text-anchor="middle">terminal → CloudFront</text></g>
<g><rect class="warning-pill" x="700" y="811" width="490" height="52" rx="24"/><text class="pill-text" x="945" y="844" text-anchor="middle">terminal → execute-api: sem CORS</text></g>
<g><rect class="pill" x="2980" y="350" width="74" height="52" rx="24"/><text class="pill-text" x="3017" y="383" text-anchor="middle">sim</text></g>
<g><rect class="warning-pill" x="2980" y="583" width="74" height="52" rx="24"/><text class="pill-text" x="3017" y="616" text-anchor="middle">não</text></g>
<g><rect class="box" x="45" y="325" width="285" height="125" rx="22"/><text class="node-title" x="187.5" y="368" text-anchor="middle">Navegador</text><text class="node-line" x="187.5" y="400" text-anchor="middle">Site no CloudFront</text><text class="node-line" x="187.5" y="427" text-anchor="middle">clique: registra interesse</text></g>
<g><rect class="box" x="45" y="650" width="285" height="125" rx="22"/><text class="node-title" x="187.5" y="693" text-anchor="middle">Terminal</text><text class="node-line" x="187.5" y="725" text-anchor="middle">Pode chamar CloudFront</text><text class="node-line" x="187.5" y="752" text-anchor="middle">ou a API diretamente</text></g>
<g><rect class="outline" x="430" y="83" width="330" height="110" rx="22"/><text class="node-title" x="595" y="126" text-anchor="middle">fetch execute-api</text><text class="node-line" x="595" y="158" text-anchor="middle">Outro domínio no navegador</text></g>
<g><rect class="decision" x="830" y="83" width="350" height="110" rx="22"/><text class="node-title" x="1005" y="126" text-anchor="middle">Preflight OPTIONS</text><text class="node-line" x="1005" y="158" text-anchor="middle">CORS permite o POST?</text></g>
<g><rect class="blocked" x="1260" y="68" width="390" height="110" rx="22"/><text class="node-title" x="1455" y="111" text-anchor="middle">CORS nega</text><text class="node-line" x="1455" y="143" text-anchor="middle">Navegador não envia o POST</text></g>
<g><rect class="box" x="800" y="325" width="300" height="130" rx="22"/><text class="node-title" x="950" y="368" text-anchor="middle">AWS WAF</text><text class="node-line" x="950" y="400" text-anchor="middle">ACL no CloudFront</text><text class="node-line" x="950" y="427" text-anchor="middle">Count ou Block · us-east-1</text></g>
<g><rect class="box" x="1180" y="325" width="310" height="130" rx="22"/><text class="node-title" x="1335" y="368" text-anchor="middle">CloudFront</text><text class="node-line" x="1335" y="400" text-anchor="middle">HTTPS · dois behaviors</text><text class="node-line" x="1335" y="427" text-anchor="middle">global</text></g>
<g><rect class="box" x="1740" y="225" width="320" height="125" rx="22"/><text class="node-title" x="1900" y="268" text-anchor="middle">S3 privado</text><text class="node-line" x="1900" y="300" text-anchor="middle">HTML, CSS, JS</text><text class="node-line" x="1900" y="327" text-anchor="middle">OAC · us-east-2</text></g>
<g><rect class="box" x="1740" y="470" width="320" height="125" rx="22"/><text class="node-title" x="1900" y="513" text-anchor="middle">API Gateway</text><text class="node-line" x="1900" y="545" text-anchor="middle">HTTP API pública</text><text class="node-line" x="1900" y="572" text-anchor="middle">POST /api/visits · us-east-2</text></g>
<g><rect class="box" x="2230" y="470" width="320" height="125" rx="22"/><text class="node-title" x="2390" y="513" text-anchor="middle">Lambda</text><text class="node-line" x="2390" y="545" text-anchor="middle">Valida header e corpo</text><text class="node-line" x="2390" y="572" text-anchor="middle">us-east-2</text></g>
<g><rect class="decision" x="2670" y="470" width="300" height="125" rx="22"/><text class="node-title" x="2820" y="513" text-anchor="middle">Valor confere?</text><text class="node-line" x="2820" y="545" text-anchor="middle">ORIGIN_VERIFY_SECRET</text></g>
<g><rect class="box" x="3060" y="365" width="295" height="115" rx="22"/><text class="node-title" x="3207.5" y="408" text-anchor="middle">DynamoDB</text><text class="node-line" x="3207.5" y="440" text-anchor="middle">Grava eventId</text><text class="node-line" x="3207.5" y="467" text-anchor="middle">us-east-2</text></g>
<g><rect class="blocked" x="3060" y="610" width="295" height="115" rx="22"/><text class="node-title" x="3207.5" y="653" text-anchor="middle">HTTP 403</text><text class="node-line" x="3207.5" y="685" text-anchor="middle">Não grava no banco</text></g>
<g><rect class="log-box" x="800" y="670" width="320" height="115" rx="22"/><text class="node-title" x="960" y="713" text-anchor="middle">CloudWatch Logs</text><text class="node-line" x="960" y="745" text-anchor="middle">Logs do WAF</text><text class="node-line" x="960" y="772" text-anchor="middle">us-east-1</text></g>
<g><rect class="log-box" x="2220" y="698" width="330" height="115" rx="22"/><text class="node-title" x="2385" y="741" text-anchor="middle">CloudWatch Logs</text><text class="node-line" x="2385" y="773" text-anchor="middle">Logs da Lambda</text><text class="node-line" x="2385" y="800" text-anchor="middle">us-east-2</text></g>
<text class="note" x="1050" y="312">Se permitido pelo WAF</text>
<text class="minor" x="1000" y="645">WAF registra ações Count/Block</text>
<text class="minor" x="2150" y="620">API invoca a Lambda mesmo sem o valor</text>
<path d="M45 880 H3355" stroke="#34566b" stroke-width="2"/>
<text x="45" y="911" fill="#9bbacc" font-family="Arial,sans-serif" font-size="20">O WAF só inspeciona o tráfego que passa pelo CloudFront. A API direta ainda invoca a Lambda; sem o valor esperado, ela responde 403 antes da escrita.</text>
</svg>
